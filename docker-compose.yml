services:
  n8n:
    image: n8nio/n8n:1.121.1
    restart: always
    env_file:
      - ./n8n.env
    environment:
      - GENERIC_TIMEZONE=America/Toronto
      - TZ=EST
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_NATIVE_PYTHON_RUNNER=true
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=300   # seconds, keep the runner alive when idle
      - N8N_RUNNERS_TASK_TIMEOUT=300          # seconds, allow long downloads
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=true
      - DB_TYPE=sqlite
      - DB_SQLITE_POOL_SIZE=3
    ports:
      - "5678:5678"
      - "5679:5679"
    volumes:
      - n8n_data:/home/node/.n8n
      - shared_data:/data/shared

  runner:
    user: "1000:1000"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./n8n.env
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=300
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_RUNNERS_LAUNCHER_RUNNER_TYPE=python
      # - N8N_RUNNERS_LAUNCHER_LOG_LEVEL=debug
    volumes:
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
      - shared_data:/data/shared
    depends_on:
      - n8n

volumes:
  n8n_data:
    external: true
  shared_data: 
